services:
  # PostgreSQL database service (matches the Azure Database for PostgreSQL
  # Flexible Server major version used in Azure: PostgreSQL 17)
  postgres-db:
    image: postgres:17-alpine
    container_name: photoalbum-postgres
    environment:
      - POSTGRES_DB=${APP_DB_NAME:-photoalbum}
      # Keep the image's bootstrap superuser separate from the application role.
      - POSTGRES_USER=${POSTGRES_ADMIN_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set (copy .env.example to .env)}
      - APP_USER=${APP_USER:-photoalbum}
      - APP_USER_PASSWORD=${APP_USER_PASSWORD:?APP_USER_PASSWORD must be set (copy .env.example to .env)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - photoalbum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${APP_DB_NAME:-photoalbum}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Photo Album Java Application  
  photoalbum-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photoalbum-java-app
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${APP_DB_NAME:-photoalbum}
      - SPRING_DATASOURCE_USERNAME=${APP_USER:-photoalbum}
      - SPRING_DATASOURCE_PASSWORD=${APP_USER_PASSWORD:?APP_USER_PASSWORD must be set (copy .env.example to .env)}
      - APP_ADMIN_USERNAME=${APP_ADMIN_USERNAME:-admin}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD must be set (copy .env.example to .env)}
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - photoalbum-network
    restart: on-failure

volumes:
  postgres_data:

networks:
  photoalbum-network:
    driver: bridge
