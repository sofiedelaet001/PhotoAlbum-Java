# Spring Boot Configuration
server.port=8080

# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Azure Database for PostgreSQL Configuration (passwordless / Microsoft Entra)
#
# 1. Do not set spring.datasource.password; the access token is retrieved
#    automatically and used as the password.
# 2. For system-assigned managed identity only, "spring.cloud.azure.credential.client-id"
#    can be omitted.
# 3. For service principal auth, remove "spring.cloud.azure.credential.managed-identity-enabled"
#    and add these properties:
#      spring.cloud.azure.profile.tenant-id=<your-service-principal-tenant-id>
#      spring.cloud.azure.credential.client-id=<your-service-principal-client-id>
#      spring.cloud.azure.credential.client-secret=<your-service-principal-client-secret>
# 4. For Azure sovereign clouds, set the following two properties (the "azure" cloud
#    type is the default and can be omitted):
#      spring.cloud.azure.profile.cloud-type=azure_china / azure_germany / azure_us_government / azure
#      spring.datasource.azure.scopes=<scope-for-your-cloud>
#        azure_china:          https://ossrdbms-aad.database.chinacloudapi.cn/.default
#        azure_germany:        https://ossrdbms-aad.database.cloudapi.de/.default
#        azure_us_government:  https://ossrdbms-aad.database.usgovcloudapi.net/.default
#        azure:                https://ossrdbms-aad.database.windows.net/.default
# 5. On Azure the Service Connector linker "photoalbumdb" injects
#    spring.datasource.url, spring.datasource.username,
#    spring.datasource.azure.passwordless-enabled,
#    spring.cloud.azure.credential.client-id and
#    spring.cloud.azure.credential.managed-identity-enabled at runtime, so the
#    placeholders below are only used for local/non-Azure runs. Never hard-code
#    a credential here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/photoalbum}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:photoalbum}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.azure.passwordless-enabled=${SPRING_DATASOURCE_AZURE_PASSWORDLESS_ENABLED:true}
spring.cloud.azure.credential.managed-identity-enabled=${SPRING_CLOUD_AZURE_CREDENTIAL_MANAGED_IDENTITY_ENABLED:true}
# User-assigned managed identity client id. Leave empty for a system-assigned
# managed identity. On Azure this is injected by the Service Connector linker.
spring.cloud.azure.credential.client-id=${SPRING_CLOUD_AZURE_CREDENTIAL_CLIENT_ID:}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# The default profile targets a persistent (Azure) PostgreSQL server, so the
# schema is evolved in place rather than dropped and recreated on every start.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Application Configuration - File Upload Validation
app.file-upload.max-file-size-bytes=10485760
app.file-upload.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
app.file-upload.max-files-per-upload=10

# Logging
logging.level.com.photoalbum=DEBUG
logging.level.org.springframework.web=DEBUG
